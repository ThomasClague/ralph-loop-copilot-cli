<section id="guarantee" class="guarantee section">
  <div class="container">
    {{#if badgeText}}
    <div class="guarantee__badge-text">{{badgeText}}</div>
    {{else}}
    <div class="guarantee__badge">🏆</div>
    {{/if}}
    <h2>{{headline}}</h2>
    <p style="max-width:600px;margin:1rem auto 0;color:var(--text-muted);">{{body}}</p>
    <div style="margin-top:2rem;">
      <a href="#contact" class="btn btn-primary">Get Your Free Quote</a>
    </div>
  </div>
</section>
