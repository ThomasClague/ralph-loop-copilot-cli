<section id="brands" class="brands section section--alt">
  <div class="container">
    {{#if headline}}<div class="section-header"><h2>{{headline}}</h2></div>{{/if}}
    <div class="brands__logos">
      {{#each brands}}
      {{#if logoUrl}}
      <img class="brand-logo" src="{{logoUrl}}" alt="{{name}}" loading="lazy" />
      {{else}}
      <span class="brand-name">{{name}}</span>
      {{/if}}
      {{/each}}
    </div>
  </div>
</section>
