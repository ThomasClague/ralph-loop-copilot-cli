<section id="pricing" class="pricing section">
  <div class="container">
    <div class="section-header"><h2>{{headline}}</h2></div>
    <div class="grid grid-3">
      {{#each tiers}}
      <div class="card pricing-card{{#if highlighted}} pricing-card--highlighted{{/if}}">
        {{#if highlighted}}<div class="pricing-badge">Most Popular</div>{{/if}}
        <div class="pricing-name">{{name}}</div>
        <div class="pricing-price">{{price}}</div>
        <ul class="pricing-features">
          {{#each features}}
          <li class="pricing-feature">{{this}}</li>
          {{/each}}
        </ul>
        <a href="#contact" class="btn btn-primary" style="width:100%;">Get Started</a>
      </div>
      {{/each}}
    </div>
  </div>
</section>
