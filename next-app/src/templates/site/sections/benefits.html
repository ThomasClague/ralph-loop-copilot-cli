<section id="benefits" class="benefits section section--alt">
  <div class="container">
    <div class="section-header"><h2>{{headline}}</h2></div>
    <div class="grid grid-3">
      {{#each items}}
      <div class="card">
        {{#if icon}}<div class="benefit-icon">{{icon}}</div>{{/if}}
        <div class="benefit-title">{{title}}</div>
        <p class="benefit-desc">{{description}}</p>
      </div>
      {{/each}}
    </div>
  </div>
</section>
