<section id="process" class="process section section--alt">
  <div class="container">
    <div class="section-header"><h2>{{headline}}</h2></div>
    <div class="grid grid-3">
      {{#each steps}}
      <div class="process-step card">
        <div class="step-number">{{number}}</div>
        <div>
          <h3>{{title}}</h3>
          <p>{{description}}</p>
        </div>
      </div>
      {{/each}}
    </div>
  </div>
</section>
