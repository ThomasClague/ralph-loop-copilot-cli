<section id="contact" class="contact section section--alt">
  <div class="container">
    <div class="section-header"><h2>{{headline}}</h2></div>
    {{#if showForm}}
    <div style="max-width:560px;margin:0 auto;">
      <form class="contact__form" action="#" method="POST" novalidate>
        <div class="form-group">
          <label for="contact-name">Name</label>
          <input type="text" id="contact-name" name="name" placeholder="Your name" required />
        </div>
        <div class="form-group">
          <label for="contact-phone">Phone</label>
          <input type="tel" id="contact-phone" name="phone" placeholder="(555) 000-0000" />
        </div>
        <div class="form-group">
          <label for="contact-email">Email</label>
          <input type="email" id="contact-email" name="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label for="contact-message">Message</label>
          <textarea id="contact-message" name="message" placeholder="How can we help you?"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send Message</button>
      </form>
    </div>
    {{/if}}
    {{#if showMap}}
    <div class="service-area__map" style="margin-top:2rem;">
      <iframe src="{{mapEmbedUrl}}" title="Our location" loading="lazy"></iframe>
    </div>
    {{/if}}
  </div>
</section>
